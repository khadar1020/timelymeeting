<svg width="1400" height="980" viewBox="0 0 1400 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5 1.5L7 4L1.5 6.5" stroke="#7A869A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#172B4D" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 32px Arial, sans-serif;fill:#172B4D}
      .box-text{font:600 18px Arial, sans-serif;fill:#172B4D}
      .small{font:600 15px Arial, sans-serif;fill:#5E6C84}
      .label{font:700 15px Arial, sans-serif;fill:#42526E}
      .line{stroke:#7A869A;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .box{stroke:#42526E;stroke-width:2.2;rx:16;filter:url(#shadow)}
      .decision{stroke:#42526E;stroke-width:2.2;filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1400" height="980" fill="#F7FAFC"/>
  <text x="54" y="64" class="title">Stripe Payment Gateway Flow</text>

  <rect x="70" y="120" width="230" height="76" class="box" fill="#E6FCFF"/>
  <text x="185" y="153" text-anchor="middle" class="box-text">Booker selects</text>
  <text x="185" y="177" text-anchor="middle" class="box-text">paid slot</text>

  <rect x="370" y="120" width="230" height="76" class="box" fill="#E3FCEF"/>
  <text x="485" y="153" text-anchor="middle" class="box-text">Submit booking</text>
  <text x="485" y="177" text-anchor="middle" class="box-text">form</text>

  <rect x="670" y="120" width="250" height="76" class="box" fill="#EAE6FF"/>
  <text x="795" y="153" text-anchor="middle" class="box-text">Create Stripe</text>
  <text x="795" y="177" text-anchor="middle" class="box-text">Checkout session</text>

  <rect x="1000" y="120" width="250" height="76" class="box" fill="#FFE2E2"/>
  <text x="1125" y="153" text-anchor="middle" class="box-text">Redirect to</text>
  <text x="1125" y="177" text-anchor="middle" class="box-text">Stripe Checkout</text>

  <path d="M1125 280L1250 330L1125 380L1000 330Z" class="decision" fill="#FFF4E5"/>
  <text x="1125" y="325" text-anchor="middle" class="box-text">Payment result</text>
  <text x="1125" y="350" text-anchor="middle" class="small">Stripe hosted page</text>

  <rect x="880" y="470" width="250" height="76" class="box" fill="#FFEBE6"/>
  <text x="1005" y="503" text-anchor="middle" class="box-text">Return to</text>
  <text x="1005" y="527" text-anchor="middle" class="box-text">/booking/cancel</text>

  <rect x="880" y="620" width="250" height="82" class="box" fill="#F4F5F7"/>
  <text x="1005" y="650" text-anchor="middle" class="box-text">No booking or</text>
  <text x="1005" y="674" text-anchor="middle" class="box-text">calendar event</text>
  <text x="1005" y="694" text-anchor="middle" class="small">is created</text>

  <rect x="470" y="300" width="310" height="82" class="box" fill="#E3FCEF"/>
  <text x="625" y="330" text-anchor="middle" class="box-text">Stripe sends</text>
  <text x="625" y="354" text-anchor="middle" class="box-text">checkout.session.completed</text>
  <text x="625" y="374" text-anchor="middle" class="small">webhook</text>

  <rect x="470" y="470" width="310" height="76" class="box" fill="#DEEBFF"/>
  <text x="625" y="503" text-anchor="middle" class="box-text">Verify webhook</text>
  <text x="625" y="527" text-anchor="middle" class="box-text">signature</text>

  <rect x="470" y="620" width="310" height="82" class="box" fill="#E6FCFF"/>
  <text x="625" y="650" text-anchor="middle" class="box-text">Check event and slot</text>
  <text x="625" y="674" text-anchor="middle" class="box-text">availability again</text>

  <path d="M625 760L760 812L625 864L490 812Z" class="decision" fill="#FFF4E5"/>
  <text x="625" y="806" text-anchor="middle" class="box-text">Slot still</text>
  <text x="625" y="830" text-anchor="middle" class="box-text">available?</text>

  <rect x="90" y="770" width="280" height="84" class="box" fill="#FFEBE6"/>
  <text x="230" y="800" text-anchor="middle" class="box-text">Reject webhook</text>
  <text x="230" y="824" text-anchor="middle" class="box-text">handling for</text>
  <text x="230" y="846" text-anchor="middle" class="small">manual review</text>

  <rect x="860" y="770" width="280" height="84" class="box" fill="#E3FCEF"/>
  <text x="1000" y="800" text-anchor="middle" class="box-text">Create Google</text>
  <text x="1000" y="824" text-anchor="middle" class="box-text">Calendar event</text>
  <text x="1000" y="846" text-anchor="middle" class="small">and Meet link</text>

  <rect x="860" y="895" width="230" height="58" class="box" fill="#DEEBFF"/>
  <text x="975" y="930" text-anchor="middle" class="box-text">Save as CONFIRMED</text>

  <rect x="1140" y="895" width="230" height="58" class="box" fill="#EAE6FF"/>
  <text x="1255" y="930" text-anchor="middle" class="box-text">Return to success</text>

  <path class="line" d="M300 158H368"/>
  <path class="line" d="M600 158H668"/>
  <path class="line" d="M920 158H998"/>
  <path class="line" d="M1125 196V278"/>
  <path class="line" d="M1068 368L1020 468"/>
  <text x="1024" y="430" class="label">Cancelled</text>
  <path class="line" d="M1005 546V618"/>
  <path class="line" d="M1000 330H820V341H782"/>
  <text x="833" y="314" class="label">Succeeded</text>
  <path class="line" d="M625 382V468"/>
  <path class="line" d="M625 546V618"/>
  <path class="line" d="M625 702V758"/>
  <path class="line" d="M490 812H372"/>
  <text x="418" y="793" class="label">No</text>
  <path class="line" d="M760 812H858"/>
  <text x="803" y="793" class="label">Yes</text>
  <path class="line" d="M1000 854V893"/>
  <path class="line" d="M1090 924H1138"/>
</svg>
